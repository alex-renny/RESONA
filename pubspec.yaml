name: resona
description: "RESONA — Shape Your Sound. Professional audio editing & mixing application."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # File handling
  file_picker: ^8.0.3
  path: ^1.9.0

  # Audio playback (Phase 1 — cutting/merging engine via FFmpeg arrives in a later phase)
  just_audio: ^0.9.39

  # UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Open exported files/folders in the OS
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
